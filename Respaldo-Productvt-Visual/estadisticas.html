<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuaderno de Progreso</title>
<!-- Mockup de Estadísticas — RECREACIÓN v3.2 (2026-09-15).
     La versión anterior usaba el modelo viejo de CATEGORÍAS, que ya no existe
     (v3.1 §K1). Esta versión se alimenta de los bloques terminados del cronómetro
     (clave compartida productvt-blocks-v1, enmienda v3 §D1) y los desglosa por
     SUPERMETA y META. Si todavía no hay bloques reales, genera una semana demo
     derivada de las supermetas para poder revisar la UI. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..520;1,9..144,380..520&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper: #EFEDE5; --paper-raised: #FAF9F3; --ink: #20241E; --muted: #6E7368;
    --accent: #3A6B54; --accent-ink: #F3F7F1; --accent-soft: #DCE6DC;
    --rule: #D5D1C1; --rule-strong: #B9B4A0; --gold: #B9812E; --danger: #9C4A3A; --focus: #3A6B54;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
      --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
      --rule: #2B3225; --rule-strong: #3C4433; --gold: #D9A85C; --danger: #D08871; --focus: #7BB596;
    }
  }
  :root[data-theme="dark"]{
    --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
    --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
    --rule: #2B3225; --rule-strong: #3C4433; --gold: #D9A85C; --danger: #D08871; --focus: #7BB596;
  }
  *{ box-sizing: border-box; }
  body{ background: var(--paper); color: var(--ink); font-family: "Archivo", ui-sans-serif, system-ui, sans-serif; line-height: 1.45; margin: 0; }
  .shell{ max-width: 460px; margin: 0 auto; padding: 20px 18px 48px; }
  h1{ font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub{ font-size: 12.5px; color: var(--muted); margin: 0 0 18px; }
  .tiles{ display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 22px; }
  .tile{ border: 1px solid var(--rule); border-radius: 10px; padding: 12px 10px; text-align: center; background: var(--paper-raised); }
  .tile .val{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tile .lbl{ font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  h2{ font-family: "Fraunces", Georgia, serif; font-size: 16px; font-weight: 500; margin: 28px 0 10px; }
  .sparkline{ display: flex; align-items: flex-end; gap: 4px; height: 64px; margin-bottom: 6px; }
  .spark-bar{ flex: 1; background: var(--accent-soft); border-radius: 3px 3px 0 0; position: relative; min-height: 3px; }
  .spark-bar.today{ background: var(--accent); }
  .spark-labels{ display: flex; gap: 4px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9px; color: var(--muted); }
  .spark-labels span{ flex: 1; text-align: center; }
  .bar-row{ display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row .swatch{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bar-row .label{ width: 110px; font-size: 12.5px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track{ flex: 1; height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
  .bar-fill{ height: 100%; border-radius: 4px; }
  .bar-row .amount{ width: 56px; text-align: right; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted); flex: none; }
  .goal-card{ border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--paper-raised); }
  .goal-top{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .goal-top .name{ display: flex; align-items: center; gap: 7px; }
  .goal-top .swatch{ width: 8px; height: 8px; border-radius: 50%; }
  .goal-track{ height: 7px; background: var(--rule); border-radius: 4px; overflow: hidden; }
  .goal-fill{ display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .goal-fill.partial{ background: var(--gold); }
  .star-card{ display: flex; align-items: center; gap: 12px; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--paper-raised); }
  .star-badge{ font-size: 24px; color: var(--rule-strong); }
  .star-badge.earned{ color: var(--gold); }
  .star-card .text strong{ display: block; font-size: 13.5px; }
  .star-card .text span{ font-size: 11.5px; color: var(--muted); }
  .empty{ color: var(--muted); font-size: 12.5px; }
  .nav-links{ display: flex; gap: 14px; margin-top: 26px; }
  .nav-links a{ font-size: 12px; color: var(--muted); text-decoration: none; }
  .nav-links a:hover{ color: var(--accent); }
</style>
</head>
<body>
<div class="shell">
  <h1>Cuaderno de progreso</h1>
  <p class="sub">Los bloques que terminas en el cronómetro se registran aquí por supermeta y meta (v3 §D1, v3.1 §K1).</p>
  <div class="tiles" id="tiles"></div>
  <div id="content"></div>
  <div class="nav-links">
    <a href="galaxia-v2.html">← Inicio · Galaxia</a>
    <a href="calendario.html">Calendario</a>
  </div>
</div>
<script>
(function(){
  "use strict";
  var SUPER_KEY = "productvt-supermetas-v1";
  var BLOCKS_KEY = "productvt-blocks-v1";
  var WEEKLY_KEY = "productvt-weekly-goals-v1";
  function loadJSON(key, fb){ try{ var r = localStorage.getItem(key); return r ? JSON.parse(r) : fb; }catch(e){ return fb; } }

  var SUPERMETAS = loadJSON(SUPER_KEY, null);
  if(!SUPERMETAS || !SUPERMETAS.length){
    SUPERMETAS = [
      { id: "sg-titulo", name: "Título", color: "#4E6E8E", anti: false, goals: [
        { id: "g-ramo1", name: "Ramo 1", color: "#3A6B54" },
        { id: "g-proyecto", name: "Proyecto", color: "#2E7B84" } ] },
      { id: "sg-tesis", name: "Tesis", color: "#B9812E", anti: false, goals: [
        { id: "g-cap2", name: "Capítulo 2", color: "#8C5A7A" } ] },
      { id: "sg-antimeta", name: "Antimeta", color: "#9C4A3A", anti: true, goals: [] }
    ];
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function isoDate(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function mondayOf(d){ var x = new Date(d); var wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }

  // ---- bloques reales del cronómetro; si no hay, semana demo derivada de las supermetas ----
  var realBlocks = loadJSON(BLOCKS_KEY, []);
  var blocks = realBlocks;
  var isDemo = false;
  if(!blocks.length){
    isDemo = true;
    var mon = mondayOf(new Date());
    var nonAnti = SUPERMETAS.filter(function(s){ return !s.anti; });
    var pattern = [ [0, 100, 0], [1, 120, 1], [2, 60, 0], [3, 90, 0], [4, 150, 1] ];
    blocks = pattern.map(function(p, i){
      var sup = nonAnti[p[2] % Math.max(1, nonAnti.length)] || SUPERMETAS[0];
      var goal = sup && sup.goals[i % Math.max(1, sup.goals.length)];
      var d = new Date(mon); d.setDate(d.getDate() + p[0]);
      return { id: "demo" + i, date: isoDate(d), startMin: 15*60, seconds: p[1]*60,
        title: goal ? goal.name : (sup ? sup.name : "Bloque"), supermetaId: sup ? sup.id : null,
        metaId: goal ? goal.id : null, kind: "tarea", anti: false, status: "completed", demo: true };
    });
  }
  function goalById(id){
    var f = null;
    SUPERMETAS.forEach(function(s){ s.goals.forEach(function(g){ if(g.id === id) f = { goal: g, sup: s }; }); });
    return f;
  }
  function supById(id){ return SUPERMETAS.filter(function(s){ return s.id === id; })[0] || null; }

  function minutesOf(b){ return Math.round((b.seconds || 0) / 60); }
  function todayIso(){ return isoDate(new Date()); }
  function weekRange(){ var a = mondayOf(new Date()); var b = new Date(a); b.setDate(b.getDate()+6); return [a, b]; }
  function monthRange(){ var n = new Date(); return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth()+1, 0)]; }
  function minutesIn(list, d0, d1){
    return list.filter(function(b){
      var t = b.date;
      return t >= isoDate(d0) && t <= isoDate(d1);
    }).reduce(function(acc, b){ return acc + minutesOf(b); }, 0);
  }
  function last7(){
    var out = [];
    for(var i = 6; i >= 0; i--){
      var d = new Date(); d.setDate(d.getDate() - i);
      out.push({ date: d, minutes: minutesIn(blocks, d, d) });
    }
    return out;
  }
  // racha: días consecutivos con estudio terminando hoy (o ayer)
  function streak(){
    var n = 0, d = new Date();
    if(!minutesIn(blocks, d, d)) d.setDate(d.getDate()-1);
    while(minutesIn(blocks, d, d) > 0){ n++; d.setDate(d.getDate()-1); }
    return n;
  }

  // ---- render ----
  var content = document.getElementById("content");
  var tiles = document.getElementById("tiles");
  var DAY_L = ["D","L","M","M","J","V","S"];

  function render(){
    var wk = weekRange(), mo = monthRange();
    var todayMin = minutesIn(blocks, new Date(), new Date());
    tiles.innerHTML =
      '<div class="tile"><div class="val">'+todayMin+'</div><div class="lbl">min hoy</div></div>' +
      '<div class="tile"><div class="val">'+streak()+'</div><div class="lbl">días de racha</div></div>' +
      '<div class="tile"><div class="val">'+minutesIn(blocks, mo[0], mo[1])+'</div><div class="lbl">min este mes</div></div>';

    var html = "";
    if(isDemo) html += '<p class="empty">Mostrando datos demo: todavía no hay bloques terminados. Termina un bloque en el <a href="cronometro.html">cronómetro</a> y aparecerá aquí (§D1).</p>';

    // sparkline 7 días
    var l7 = last7(), max = Math.max(60, Math.max.apply(null, l7.map(function(x){ return x.minutes; })));
    html += '<h2>Últimos 7 días</h2>';
    html += '<div class="sparkline">' + l7.map(function(x){
      var h = Math.max(3, Math.round(x.minutes / max * 64));
      return '<div class="spark-bar'+(isoDate(x.date)===todayIso()?" today":"")+'" style="height:'+h+'px" title="'+x.minutes+' min"></div>';
    }).join("") + '</div>';
    html += '<div class="spark-labels">' + l7.map(function(x){ return '<span>'+DAY_L[x.date.getDay()]+'</span>'; }).join("") + '</div>';

    // desglose por supermeta (mes) — LAS CATEGORÍAS NO EXISTEN (§K1)
    html += '<h2>Por supermeta (este mes)</h2>';
    var bySup = SUPERMETAS.map(function(s){
      return { sup: s, minutes: minutesIn(blocks.filter(function(b){ return b.supermetaId === s.id; }), mo[0], mo[1]) };
    }).filter(function(x){ return x.minutes > 0; }).sort(function(a,b){ return b.minutes - a.minutes; });
    if(bySup.length){
      var maxS = bySup[0].minutes;
      html += bySup.map(function(x){
        return '<div class="bar-row"><span class="swatch" style="background:'+x.sup.color+'"></span>' +
          '<span class="label">'+x.sup.name+(x.sup.anti?' <small>(sin puntaje)</small>':'')+'</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:'+Math.round(x.minutes/maxS*100)+'%;background:'+x.sup.color+'"></span></span>' +
          '<span class="amount">'+x.minutes+' min</span></div>';
      }).join("");
    } else {
      html += '<p class="empty">Sin tiempo registrado este mes.</p>';
    }

    // desglose por meta dentro de cada supermeta con tiempo (mes)
    html += '<h2>Por meta (este mes)</h2>';
    var byGoal = [];
    blocks.forEach(function(b){
      if(!b.metaId) return;
      var f = goalById(b.metaId);
      if(!f) return;
      var row = byGoal.filter(function(x){ return x.id === b.metaId; })[0];
      if(!row){ row = { id: b.metaId, goal: f.goal, sup: f.sup, minutes: 0 }; byGoal.push(row); }
      row.minutes += minutesOf(b);
    });
    byGoal = byGoal.filter(function(x){ return x.minutes > 0; }).sort(function(a,b){ return b.minutes - a.minutes; });
    if(byGoal.length){
      var maxG = byGoal[0].minutes;
      html += byGoal.map(function(x){
        return '<div class="bar-row"><span class="swatch" style="background:'+x.goal.color+'"></span>' +
          '<span class="label">'+x.goal.name+'</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:'+Math.round(x.minutes/maxG*100)+'%;background:'+x.goal.color+'"></span></span>' +
          '<span class="amount">'+x.minutes+' min</span></div>';
      }).join("");
    } else {
      html += '<p class="empty">Los bloques sin meta concreta (antimeta) no se desglosan aquí.</p>';
    }

    // metas semanales por supermeta (min objetivo por semana, configurables desde Configuración)
    html += '<h2>Metas semanales</h2>';
    var weekly = loadJSON(WEEKLY_KEY, {});
    var prod = SUPERMETAS.filter(function(s){ return !s.anti; });
    var anyGoal = prod.some(function(s){ return weekly[s.id]; });
    if(!anyGoal){
      prod.forEach(function(s){ if(weekly[s.id] === undefined) weekly[s.id] = 300; }); // default 300 min
    }
    html += prod.map(function(s){
      var target = weekly[s.id] || 0;
      var got = minutesIn(blocks.filter(function(b){ return b.supermetaId === s.id; }), wk[0], wk[1]);
      var pct = target ? Math.min(100, Math.round(got/target*100)) : 0;
      var met = target && got >= target;
      return '<div class="goal-card"><div class="goal-top"><span class="name"><span class="swatch" style="background:'+s.color+'"></span>'+s.name+'</span>' +
        '<span class="amount">'+got+' / '+target+' min</span></div>' +
        '<div class="goal-track"><span class="goal-fill '+(met?"":"partial")+'" style="width:'+pct+'%;'+(met?"":"background:var(--gold)")+'"></span></div></div>';
    }).join("");

    // estrella del mes: todas las semanas del mes cumplen todas las metas semanales
    var mStart = mo[0];
    var weeks = [];
    var w = mondayOf(mStart);
    while(w <= mo[1]){
      var wEnd = new Date(w); wEnd.setDate(wEnd.getDate()+6);
      weeks.push([w, wEnd]);
      w = new Date(w); w.setDate(w.getDate()+7);
    }
    var withGoals = prod.filter(function(s){ return weekly[s.id]; });
    var allMet = withGoals.length > 0 && weeks.every(function(wr){
      return withGoals.every(function(s){
        return minutesIn(blocks.filter(function(b){ return b.supermetaId === s.id; }), wr[0], wr[1]) >= weekly[s.id];
      });
    });
    html += '<h2>Estrella del mes</h2>';
    html += '<div class="star-card"><span class="star-badge'+(allMet?" earned":"")+'">★</span><div class="text">' +
      '<strong>'+(allMet ? "¡Conseguida!" : "Todavía no")+'</strong>' +
      '<span>'+(withGoals.length ? weeks.length + " semana(s) evaluada(s) contra las metas semanales" : "Configura metas semanales para poder ganarla")+'</span>' +
      '</div></div>';

    content.innerHTML = html;
  }
  render();
})();

</script>
</body>
</html>
