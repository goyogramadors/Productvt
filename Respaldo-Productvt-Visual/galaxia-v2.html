<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constelación de Metas v2</title>
<!-- Mockup interactivo de la galaxia — enmienda v3 §E (decisiones-tomadas.md).
     Comportamiento: solo supermetas (planetas) y metas (mini-planetas con enlaces,
     sensación tipo Obsidian Graph View §E1–E2); proporción considerable con metas
     como estrellas desde la vista general (§E3); orden circular por creación en
     sentido horario con "Restablecer" (§E4); arrastre libre y acomodo coordinado
     al soltar, empujando a las demás (§E5); vista de foco a pantalla completa con
     el planeta ocupando la mitad de la pantalla (§E6); posiciones persistidas en
     localStorage salvo reseteo (§E7); antimetas ocultas con botón (§E8); HUD
     decorativo (§F2) y botón crear como hotkey (§E9). -->
<style>
  :root{
    --paper: #EFEDE5; --paper-raised: #FAF9F3; --ink: #20241E; --muted: #6E7368;
    --accent: #3A6B54; --accent-ink: #F3F7F1; --accent-soft: #DCE6DC;
    --rule: #D5D1C1; --rule-strong: #B9B4A0; --danger: #9C4A3A;
    --hud-bg: #16213F; --hud-bg-2: #223462; --hud-ink: #F3F1E7;
    --cr-gold: #FFB627;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
      --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
      --rule: #2B3225; --rule-strong: #3C4433; --danger: #D08871;
    }
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; overflow: hidden; }
  body{
    background: var(--paper); color: var(--ink);
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button{ font: inherit; cursor: pointer; }
  .hud{
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; pointer-events: none;
  }
  .hud > *{ pointer-events: auto; }
  .pill{
    display: inline-flex; align-items: center; gap: 5px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 600;
    border: 2px solid var(--hud-bg-2); background: var(--hud-bg); border-radius: 9px;
    padding: 6px 12px 6px 8px; color: var(--hud-ink); box-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .pill.streak{ color: #FF8A5C; }
  .pill.currency{ color: var(--cr-gold); }
  .hud .spacer{ flex: 1; }
  .icon-btn{
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--hud-bg-2); background: var(--hud-bg);
    color: var(--hud-ink); font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .hud-tool{
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
    border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--ink);
    border-radius: 8px; padding: 6px 10px;
  }
  .hud-tool[aria-pressed="true"]{ border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .fab{
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 26px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .hint-line{
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); background: var(--paper-raised);
    border: 1px solid var(--rule); border-radius: 12px; padding: 5px 12px; z-index: 20; max-width: 92%; text-align: center;
  }
  body.focus .hint-line{ display: none; }
  #stage{ position: fixed; inset: 0; }
  #links{ position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #links line{ stroke: var(--rule-strong); stroke-width: 1; opacity: .6; }
  .planet{
    position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: inset -8px -8px 0 rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.22);
  }
  .planet.dragging{ cursor: grabbing; box-shadow: inset -8px -8px 0 rgba(0,0,0,.18), 0 10px 26px rgba(0,0,0,.35); z-index: 10; }
  .planet .pl-label{
    position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    font-size: 11.5px; color: var(--ink); white-space: nowrap;
    padding: 2px 8px; border-radius: 8px; pointer-events: none;
    background: var(--paper-raised); border: 1px solid var(--rule);
  }
  .planet.anti{ border: 2px dashed var(--danger); box-shadow: none; }
  .planet.anti .pl-label{ color: var(--danger); }
  .moon{
    position: absolute; border-radius: 50%; background: var(--muted);
    width: 9px; height: 9px; box-shadow: 0 2px 6px rgba(0,0,0,.25);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .moon .mn-label{
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    font-size: 9px; color: var(--muted); white-space: nowrap; display: none;
  }
  body.focus .moon{ width: 16px; height: 16px; background: var(--ink); }
  body.focus .moon .mn-label{ display: block; }
  .go-back{ position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; }
  body.focus .go-back{ display: inline-flex; }
  @keyframes pulse{ 0%,100%{ opacity: .75; } 50%{ opacity: 1; } }
  /* ---- §I8: cabecera de la vista de supermeta (nombre editable + % + config) ---- */
  .focus-head{
    position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 21;
    display: none; align-items: center; gap: 7px; max-width: 94%;
    background: var(--paper-raised); border: 1px solid var(--rule-strong);
    border-radius: 12px; padding: 7px 10px;
  }
  body.focus .focus-head{ display: flex; }
  .focus-head .fname{ font-family: "Fraunces", Georgia, serif; font-size: 15.5px; font-weight: 500; }
  .focus-head .fpct{
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px;
    font-weight: 600; color: var(--accent); flex: none;
  }
  .focus-head input{
    font: inherit; font-size: 15px; width: 132px; background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 7px; padding: 3px 7px;
  }
  .mini-btn{
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 5px 9px; font-size: 12px;
  }
  .icon-mini{
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink);
    border-radius: 6px; width: 26px; height: 24px; font-size: 11.5px; line-height: 1;
    padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  /* ---- §I4: hoja del botón crear (3 opciones) y popup de creación ---- */
  .sheet{
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: flex-end; justify-content: center; background: rgba(20,23,15,.42);
  }
  .sheet.open{ display: flex; }
  .sheet .panel{
    width: 100%; max-width: 430px; background: var(--paper-raised);
    border: 1px solid var(--rule-strong); border-radius: 14px 14px 0 0;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    max-height: 88vh; overflow-y: auto;
  }
  .sheet h3{
    margin: 0 0 2px; font-family: "Fraunces", Georgia, serif;
    font-size: 15px; font-weight: 500; display: flex; justify-content: space-between; align-items: center;
  }
  .sheet h3 .kbd{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; color: var(--muted); }
  .sheet .opt{
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink);
    border-radius: 10px; padding: 10px 12px;
  }
  .sheet .opt strong{ font-size: 13.5px; font-weight: 600; }
  .sheet .opt small{ color: var(--muted); font-size: 11px; line-height: 1.4; }
  .form-row{ display: flex; flex-direction: column; gap: 4px; }
  .form-row label{ font-size: 11px; color: var(--muted); }
  .form-row input, .form-row select, .form-row textarea{
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule-strong);
    border-radius: 8px; padding: 7px 9px; font-size: 13px; width: 100%; font-family: inherit;
  }
  .form-row textarea{ resize: vertical; min-height: 48px; }
  .palette{ display: flex; gap: 5px; flex-wrap: wrap; }
  .palette button{ width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .palette button[aria-pressed="true"]{ border-color: var(--ink); }
  /* v3.4 §C1: selector RGB libre — cualquier color vale, no solo la paleta default */
  .custom-color{
    width: 26px; height: 22px; padding: 0; border: 1px solid var(--rule-strong);
    border-radius: 5px; background: var(--paper-raised); cursor: pointer;
  }
  .custom-color.active{ border-color: var(--accent); border-width: 2px; }
  .sheet .actions{ display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .sheet .note{ font-size: 11px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
<div class="hud">
  <span class="pill streak">🔥 12</span>
  <span class="pill currency">◈ 240</span>
  <span class="spacer"></span>
  <button class="hud-tool" id="antiToggle" aria-pressed="false" title="Mostrar antimetas (v3 §E8)">✦ Antimetas</button>
  <button class="hud-tool" id="resetView" title="Restablecer orden circular por creación (v3 §E4)">⟲ Restablecer</button>
  <button class="icon-btn" title="Decorativo por ahora (v3 §F2)">⚙</button>
  <button class="icon-btn" title="Decorativo por ahora (v3 §F2)">👥</button>
</div>
<button class="go-back hud-tool" id="goBack" type="button">← Volver a la galaxia</button>

<!-- §I8: título de la vista de supermeta: nombre (editable con lápiz) + % + config -->
<div class="focus-head" id="focusHead">
  <span class="fname" id="fhName"></span>
  <span class="fpct" id="fhPct"></span>
  <button class="icon-mini" id="fhEdit" type="button" title="Renombrar esta supermeta">✎</button>
  <button class="icon-mini" id="fhConfig" type="button" title="Configuración de metas y supermetas (§I8/J4)">⚙</button>
  <input type="text" id="fhInput" maxlength="28" style="display:none">
  <button class="mini-btn" id="fhSaveName" type="button" style="display:none">Guardar</button>
</div>
<div id="stage"><svg id="links"></svg></div>
<button class="fab" id="fabCreate" title="Crear (hotkey) — §I4">+</button>

<!-- §I4: hoja del botón crear, con 3 opciones -->
<div class="sheet" id="menuSheet">
  <div class="panel">
    <h3>Crear <span class="kbd">hotkey</span></h3>
    <button class="opt" id="optGoal" type="button">
      <strong>Crear supermeta / meta</strong>
      <small>Abre aquí mismo el popup: asociar a calendario, color (default: el del calendario), tareas y subtareas, plazo.</small>
    </button>
    <button class="opt" id="optBlock" type="button">
      <strong>Iniciar bloque</strong>
      <small>Redirección al cronómetro.</small>
    </button>
    <button class="opt" id="optEvent" type="button">
      <strong>Crear evento de calendario</strong>
      <small>Redirección al panel de creación de evento del calendario.</small>
    </button>
    <div class="actions"><button class="mini-btn" id="menuClose" type="button">Cerrar</button></div>
  </div>
</div>

<!-- §I4 + §I6 + §J1–J3: popup de creación de supermeta / meta -->
<div class="sheet" id="createSheet">
  <div class="panel">
    <h3 id="createTitle">Crear supermeta</h3>

    <!-- §I4.1: el popup permite crear supermeta o meta -->
    <div class="form-row">
      <label>¿Qué querés crear?</label>
      <div style="display:flex; gap:6px">
        <button class="mini-btn" id="modeSuper" aria-pressed="true" type="button">Supermeta</button>
        <button class="mini-btn" id="modeGoal" aria-pressed="false" type="button">Meta</button>
      </div>
    </div>

    <div id="superFields">
      <div class="form-row">
        <label>Nombre de la supermeta</label>
        <input type="text" id="cSuperName" maxlength="28" placeholder="p. ej. Título">
      </div>
      <div class="form-row">
        <label>¿Pertenece a un calendario existente? (§J1)</label>
        <select id="cSuperCal"></select>
      </div>
      <div class="form-row">
        <label>Color de la supermeta (default: el del calendario)</label>
        <div class="palette" id="cSuperPalette"></div>
        <input type="color" id="cSuperCustom" class="custom-color" title="Color personalizado RGB (v3.3)">
      </div>
      <div class="form-row">
        <label>Plazo de cumplimiento — máx. 1 año, mín. 1 segundo (§I6)</label>
        <input type="datetime-local" id="cSuperDeadline">
      </div>
      <div class="form-row">
        <label>¿Es antimeta? (sin puntaje, solo eventos atemporales · v3 §A7)</label>
        <button class="mini-btn" id="cSuperAnti" aria-pressed="false" type="button" style="align-self:flex-start">No</button>
      </div>
    </div>

    <div class="form-row" id="goalFields">
      <label>Nombre de la meta</label>
      <input type="text" id="cGoalName" maxlength="40" placeholder="p. ej. Ramo 1">
      <label style="margin-top:6px">Supermeta a la que pertenece (§J3)</label>
      <select id="cGoalSuper"></select>
      <label style="margin-top:6px">Color de la meta (color del bloque en el calendario · §K3)</label>
      <div class="palette" id="cGoalPalette"></div>
      <input type="color" id="cGoalCustom" class="custom-color" title="Color personalizado RGB (v3.4 §C1)">
      <label style="margin-top:6px">Plazo de cumplimiento (§I6)</label>
      <input type="datetime-local" id="cGoalDeadline">
      <label style="margin-top:6px">Tareas y subtareas (una por línea — base del % · §I7)</label>
      <textarea id="cGoalTasks" placeholder="Leer capítulo 1&#10;Ejercicios 1–10"></textarea>
    </div>

    <p class="note" id="createNote"></p>
    <div class="actions">
      <button class="mini-btn" id="createCancel" type="button">Cancelar</button>
      <button class="mini-btn" id="createSave" type="button">Crear</button>
    </div>
  </div>
</div>
<p class="hint-line">Arrastrá una supermeta para reordenarla — al soltar, la constelación se acomoda sola (v3 §E5). Clic en un planeta para verlo en foco (v3 §E6).</p>
<script>
(function(){
  var POS_KEY = "productvt-galaxia-pos-v2";
  var ORBIT_KEY = "productvt-galaxia-orbita-v1";
  var stage = document.getElementById("stage");
  var svg = document.getElementById("links");

  // ---- datos: supermetas y metas (misma fuente localStorage que Configuración) ----
  function loadSupermetas(){
    try{
      var raw = localStorage.getItem("productvt-supermetas-v1");
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed.length) return parsed.map(function(s, i){
          return {
            id: s.id || ("sg" + i),
            name: s.name,
            color: s.color || "#3A6B54",
            anti: !!s.anti,
            order: i,
            deadline: s.deadline || null,
            calendarId: s.calendarId || null,
            metas: (s.goals || []).map(function(g, j){
              if(typeof g === "string") g = { name: g };
              return {
                id: g.id || (s.id + ":" + j),
                name: g.name,
                color: g.color || s.color || "#3A6B54",
                deadline: g.deadline || null,
                tareas: (g.tareas || []).map(function(t){
                  return { name: (typeof t === "string" ? t : t.name), done: !!t.done };
                })
              };
            })
          };
        });
      }
    }catch(e){}
    return [
      { id: "titulo", name: "Título", color: "#3A6B54", anti: false, order: 0,
        deadline: null, calendarId: "cap-uni", metas: [
        { id: "t1", name: "Ramo 1", color: "#3A6B54", deadline: null, tareas: [ { name: "Leer capítulo 1", done: true }, { name: "Ejercicios 1–10", done: false }, { name: "Control 1", done: false } ] },
        { id: "t2", name: "Proyecto", color: "#2E7B84", deadline: null, tareas: [ { name: "Escribir informe", done: false } ] },
        { id: "t3", name: "Ayudantía", color: "#B9812E", deadline: null, tareas: [ { name: "Preparar guía", done: true } ] } ] },
      { id: "tesis", name: "Tesis", color: "#4E6E8E", anti: false, order: 1,
        deadline: null, calendarId: null, metas: [
        { id: "z1", name: "Capítulo 2", color: "#8C5A7A", deadline: null, tareas: [ { name: "Borrador", done: false }, { name: "Revisión", done: false } ] },
        { id: "z2", name: "Estado del arte", color: "#6B8F71", deadline: null, tareas: [ { name: "Buscar papers", done: true } ] } ] },
      { id: "idiomas", name: "Idiomas", color: "#A85C6B", anti: false, order: 2,
        deadline: null, calendarId: null, metas: [
        { id: "i1", name: "Japonés N4", color: "#C0672B", deadline: null, tareas: [ { name: "Kana", done: true } ] },
        { id: "i2", name: "Inglés C1", color: "#4A6FA5", deadline: null, tareas: [ { name: "Speaking", done: false } ] },
        { id: "i3", name: "Práctica oral", color: "#8C5A7A", deadline: null, tareas: [ { name: "Grabarse", done: false } ] } ] },
      { id: "salud", name: "Salud", color: "#6B8F71", anti: false, order: 3,
        deadline: null, calendarId: null, metas: [
        { id: "s1", name: "Gimnasio", color: "#3A6B54", deadline: null, tareas: [ { name: "3 sesiones", done: true } ] },
        { id: "s2", name: "Sueño 8h", color: "#4E6E8E", deadline: null, tareas: [ { name: "Rutina", done: false } ] } ] },
      { id: "antimeta", name: "Antimeta", color: "#9C4A3A", anti: true, order: 4,
        deadline: null, calendarId: null, metas: [] }
    ];
  }
  // v3.3: hash estable por id — variedad pseudo-aleatoria determinista (no cambia al recargar)
  function hashSeed(str){
    var h = 2166136261;
    for(var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h;
  }
  // v3.3 §I7: % de completitud PONDERADO por importancia — tareas (weight 1–3) más
  // eventos de calendario asociados a la meta que ya ocurrieron (fecha pasada).
  function goalPct(g){
    var total = 0, done = 0, today = todayISO();
    (g.tareas || []).forEach(function(t){
      var w = t.weight || 2; total += w; if(t.done) done += w;
    });
    eventsForMeta(g.id).forEach(function(e){
      var w = e.weight || 2; total += w; if(e.date < today) done += w;
    });
    return total ? Math.round(done / total * 100) : 0;
  }
  function superPct(p){
    var total = 0, done = 0, today = todayISO();
    p.metas.forEach(function(m){
      (m.tareas || []).forEach(function(t){
        var w = t.weight || 2; total += w; if(t.done) done += w;
      });
      eventsForMeta(m.id).forEach(function(e){
        var w = e.weight || 2; total += w; if(e.date < today) done += w;
      });
    });
    return total ? Math.round(done / total * 100) : 0;
  }
  // v3.3: eventos de calendario asociados a una meta (misma fuente que calendario.html)
  function eventsForMeta(metaId){
    try{
      var evs = JSON.parse(localStorage.getItem("productvt-calendario-invisibles-v1") || "[]");
      return evs.filter(function(e){ return e.metaId === metaId; });
    }catch(err){ return []; }
  }
  function todayISO(){
    var d = new Date(), p = function(n){ return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  // §I1: las lunas se orientan hacia abajo de la supermeta, manteniendo equidistancia
  function moonAngle(p, m){
    var n = p.metas.length;
    if(n <= 1) return 90;
    var spread = Math.min(140, n * 36);
    var step = spread / (n - 1);
    var idx = p.metas.indexOf(m);
    return 90 - spread / 2 + step * idx;
  }
  var planets = loadSupermetas();
  planets.forEach(function(p, i){ if(p.order === undefined) p.order = i; });

  function loadJSON(key, fallback){ try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  var angles = loadJSON(POS_KEY, {});   // { id: grados } — posición coordinada persistida (§E7)
  var orbits = loadJSON(ORBIT_KEY, {}); // { metaId: grados } — fase orbital persistida (§E7)
  var showAnti = false, focusId = null, draggingId = null, animating = false;

  function visiblePlanets(){
    return planets.filter(function(p){ return showAnti || !p.anti; });
  }
  function planetSize(p){
    if(focusId === p.id) return Math.min(window.innerWidth, window.innerHeight) * 0.5; // §E6: mitad de pantalla
    if(p.anti) return 22; // §E8: bien pequeñas
    return 62;             // §E3: proporción considerable planeta:meta
  }
  // §I3: en la vista de supermeta las lunas orbitan pegadas al borde del planeta
  function moonRadius(p, m){
    var size = planetSize(p);
    if(focusId === p.id) return size / 2 + (m.id.length % 3) * 8 + 10;
    return 52 + (m.id.length % 3) * 9;
  }
  function layoutAngles(){
    var vis = visiblePlanets();
    var n = vis.length;
    var map = {};
    vis.forEach(function(p, k){
      var slot = -90 + (360 / n) * k; // §E4: orden de creación, sentido horario
      map[p.id] = (!justReset && angles[p.id] !== undefined) ? angles[p.id] : slot;
    });
    return map;
  }
  var justReset = false;
  function refreshOrbits(){
    planets.forEach(function(p){
      p.metas.forEach(function(m){
        if(orbits[m.id] === undefined || justReset) orbits[m.id] = moonAngle(p, m);
      });
    });
  }

  // ---- §I2: sin teletransportes — cada planeta/luna tiene una posición animada que
  // se interpola suavemente hacia su posición objetivo (reordenamiento y órbitas fluidas) ----
  function ensureDom(){
    if(!stage.querySelector("svg")) stage.innerHTML = '<svg id="links"></svg>';
    var seen = {};
    visiblePlanets().forEach(function(p){
      seen[p.id] = true;
      var el = stage.querySelector('[data-planet="'+p.id+'"]');
      if(!el){
        el = document.createElement("div");
        el.className = "planet" + (p.anti ? " anti" : "");
        el.setAttribute("data-planet", p.id);
        el.innerHTML = '<span class="pl-label">' + p.name + '</span>';
        el.addEventListener("pointerdown", function(ev){ startPlanetDrag(el, ev); });
        stage.appendChild(el);
      }
      el.classList.toggle("anti", !!p.anti);
      el.querySelector(".pl-label").textContent = p.name;
      el.style.background = p.color;
      p.metas.forEach(function(m){
        seen["m:" + m.id] = true;
        var mo = stage.querySelector('[data-moon="'+m.id+'"]');
        if(!mo){
          mo = document.createElement("div");
          mo.className = "moon";
          mo.setAttribute("data-moon", m.id);
          mo.innerHTML = '<span class="mn-label">' + m.name + '</span>';
          stage.appendChild(mo);
        }
        mo.querySelector(".mn-label").textContent = focusId === p.id
          ? m.name + " · " + goalPct(m) + "%"   // §I7: % de tareas cumplidas por meta
          : m.name;
        mo.style.background = m.color || p.color;
      });
    });
    Array.prototype.slice.call(stage.querySelectorAll("[data-planet],[data-moon]")).forEach(function(el){
      var key = el.dataset.planet ? el.dataset.planet : ("m:" + el.dataset.moon);
      if(!seen[key]) el.remove();
    });
  }

  function render(){
    ensureDom();
    var w = window.innerWidth, h = window.innerHeight;
    var cx = w / 2, cy = h / 2 + 14;
    var R = Math.min(w, h) * (focusId ? 0 : 0.36);
    var amap = layoutAngles();
    refreshOrbits();
    planets.forEach(function(p){
      if(!showAnti && p.anti) return;
      var px, py;
      if(focusId === p.id){ px = cx; py = cy; }
      else if(focusId){ return; } // §E6: en foco no se ven las demás supermetas
      else {
        var a = amap[p.id] * Math.PI / 180;
        px = cx + R * Math.cos(a); py = cy + R * Math.sin(a);
      }
      p._x = px; p._y = py;                 // objetivo
      if(p.ax === undefined){ p.ax = px; p.ay = py; } // arranque sin animación
    });
  }

  // ---- posiciones animadas: interpola hacia el objetivo (fluidez §I2) ----
  function shortestDelta(from, to){
    var d = ((to - from) % 360 + 540) % 360 - 180;
    return d;
  }
  function tick(){
    var amap = layoutAngles();
    planets.forEach(function(p){
      if(!showAnti && p.anti) return;
      var el = stage.querySelector('[data-planet="'+p.id+'"]');
      if(focusId && focusId !== p.id){
        // v3.2 §E6: en foco la pantalla es COMPLETA — las demás supermetas y sus lunas
        // quedan ocultas (antes se quedaban congeladas en su última posición y se veían).
        if(el) el.style.display = "none";
        p.metas.forEach(function(m){
          var mo = stage.querySelector('[data-moon="'+m.id+'"]');
          if(mo) mo.style.display = "none";
        });
        return;
      }
      if(el) el.style.display = "";
      if(p._x === undefined) return;
      if(draggingId !== p.id){
        p.ax += (p._x - p.ax) * 0.16;
        p.ay += (p._y - p.ay) * 0.16;
      }
      var size = planetSize(p);
      var el = stage.querySelector('[data-planet="'+p.id+'"]');
      if(el){
        el.style.width = size + "px"; el.style.height = size + "px";
        el.style.left = (p.ax - size / 2) + "px";
        el.style.top = (p.ay - size / 2) + "px";
      }
      p.metas.forEach(function(m){
        var target;
        if(focusId === p.id){
          // §I3: en la vista de supermeta las lunas orbitan pegadas al borde del gran
          // planeta, como asteroides/lunas — vuelta completa, no un abanico flotante.
          var idxF = p.metas.indexOf(m);
          var speed = 0.16 + idxF * 0.012;
          orbits[m.id] = ((orbits[m.id] === undefined ? moonAngle(p, m) : orbits[m.id]) + speed) % 360;
          target = orbits[m.id];
        } else {
          // §I1 base hacia abajo y equidistante; v3.3: variedad pseudo-aleatoria estable
          // (unas hacia abajo, otras hacia el lado) + órbita elíptica pequeña alrededor
          // de su propia posición — en la vista general NO es un círculo alrededor del planeta.
          target = orbits[m.id] === undefined ? moonAngle(p, m) : orbits[m.id];
        }
        if(m._a === undefined) m._a = target;
        m._a += shortestDelta(m._a, target) * 0.2;
        var seed = hashSeed(m.id);
        var inFocus = focusId === p.id;
        var aDeg = m._a + (inFocus ? 0 : ((seed % 90) - 45));       // ±45° de variedad estable
        var radF = 0.9 + ((seed >> 4) % 25) / 100;                  // radio 0.90–1.15×
        var rOv = moonRadius(p, m) * (inFocus ? 1 : radF);
        var rad = aDeg * Math.PI / 180;
        m._x = p.ax + rOv * Math.cos(rad);
        m._y = p.ay + rOv * Math.sin(rad);
        if(!inFocus){
          // v3.3: órbita elíptica pequeña propia, orientada y tempos al azar (estables por id)
          var tSec = performance.now() / 1000;
          var eA = 7 + ((seed >> 6) % 5);                            // semieje mayor 7–11 px
          var eW = 0.4 + ((seed >> 8) % 25) / 100;                   // velocidad 0.40–0.64 rad/s
          var ePh = ((seed >> 10) % 628) / 100;                      // fase
          var tilt = (seed % 60) * Math.PI / 180;                    // inclinación de la elipse
          var ex0 = eA * Math.cos(tSec * eW + ePh);
          var ey0 = eA * 0.55 * Math.sin(tSec * eW + ePh);
          m._x += ex0 * Math.cos(tilt) - ey0 * Math.sin(tilt);
          m._y += ex0 * Math.sin(tilt) + ey0 * Math.cos(tilt);
        }
        var mo = stage.querySelector('[data-moon="'+m.id+'"]');
        if(mo){
          var ms = focusId === p.id ? 16 : 9; // §I3: en foco las lunas se ven con mayor resolución
          mo.style.display = ""; // restaurar visibilidad al salir del foco (v3.2)
          mo.style.width = ms + "px"; mo.style.height = ms + "px";
          mo.style.left = (m._x - ms / 2) + "px";
          mo.style.top = (m._y - ms / 2) + "px";
        }
      });
    });
    drawLines();
  }

  function drawLines(){
    var s = stage.querySelector("svg");
    if(!s) return;
    var out = "";
    planets.forEach(function(p){
      if(focusId && focusId !== p.id) return;
      if(p.ax === undefined) return;
      p.metas.forEach(function(m){
        if(m._x === undefined) return;
        out += '<line x1="'+p.ax+'" y1="'+p.ay+'" x2="'+m._x+'" y2="'+m._y+'"></line>';
      });
    });
    s.innerHTML = out;
  }

  // ---- §E5: arrastre libre (posiciones anómalas) + empuje a las demás; al soltar,
  // la supermeta queda en el slot circular coordinado más cercano y reordena a las demás ----
  function startPlanetDrag(el, ev){
    if(focusId) return;
    var p = planets.filter(function(x){ return x.id === el.dataset.planet; })[0];
    if(!p) return;
    ev.preventDefault();
    var moved = false;
    var startX = ev.clientX, startY = ev.clientY;
    var rect = el.getBoundingClientRect();
    var offX = ev.clientX - rect.left - rect.width / 2;
    var offY = ev.clientY - rect.top - rect.height / 2;
    var size = planetSize(p);
    draggingId = p.id;
    el.classList.add("dragging");
    function onMove(e2){
      var dx = e2.clientX - startX, dy = e2.clientY - startY;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      p._x = e2.clientX - offX; p._y = e2.clientY - offY;
      p.ax = p._x; p.ay = p._y; // el arrastrado sigue al puntero sin lag
      el.style.left = (p.ax - size / 2) + "px";
      el.style.top = (p.ay - size / 2) + "px";
      planets.forEach(function(o){ // empuje suave tipo graph view mientras se arrastra
        if(o === p || o.ax === undefined) return;
        var vx = o.ax - p.ax, vy = o.ay - p.ay;
        var d = Math.sqrt(vx * vx + vy * vy) || 1;
        if(d < 150){
          var push = (150 - d) / 150 * 12;
          o._x = o.ax + vx / d * push; o._y = o.ay + vy / d * push;
        }
      });
      drawLines();
    }
    function onUp(){
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      el.classList.remove("dragging");
      draggingId = null;
      if(!moved){ enterFocus(p.id); return; } // §E6: clic simple → foco
      var cx = window.innerWidth / 2, cy = window.innerHeight / 2 + 14;
      var ang = Math.atan2(p.ay - cy, p.ax - cx) * 180 / Math.PI;
      var vis = visiblePlanets().slice().sort(function(a, b){ return a.order - b.order; });
      var n = vis.length;
      var k = Math.round((ang + 90) / (360 / n));
      k = ((k % n) + n) % n; // slot circular más cercano al punto de soltado
      var cur = vis.map(function(x){ return x.id; }).indexOf(p.id);
      vis.splice(cur, 1);
      vis.splice(k, 0, p);
      vis.forEach(function(x, i){
        var real = planets.filter(function(q){ return q.id === x.id; })[0];
        real.order = i;
        angles[x.id] = -90 + (360 / n) * i; // nueva posición coordinada (§E5)
      });
      saveJSON(POS_KEY, angles); // §E7: persiste salvo reseteo
      render(); // §I2: los objetivos cambian y tick() los interpola → animación fluida, sin teletransporte
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  }

  // ---- §E6: vista de foco a pantalla completa + §I8: título con nombre, % y config ----
  function enterFocus(id){
    focusId = id;
    document.body.classList.add("focus");
    var p = planets.filter(function(x){ return x.id === id; })[0];

      document.getElementById("fhName").textContent = p.name;
      document.getElementById("fhPct").textContent = superPct(p) + "%";
    }
    render(); // §I3: las lunas pasan a orbitar pegadas al borde del planeta grande
  }
  function exitFocus(){

    document.body.classList.remove("focus");
    render();
  }

  function persistSupermetas(){
    try{
      var raw = localStorage.getItem("productvt-supermetas-v1");
      var arr = raw ? JSON.parse(raw) : null;
      if(!arr || !arr.length) return;
      arr.forEach(function(s){
        var p = planets.filter(function(x){ return x.name === s.name || x.id === s.id; })[0];

  // ---- §E8: antimetas ocultas por defecto; botón las muestra bien pequeñas ----
  document.getElementById("antiToggle").addEventListener("click", function(){

    this.setAttribute("aria-pressed", String(showAnti));

  // ---- §E4/§I1: restablecer al orden circular por creación, sentido horario ----
  document.getElementById("resetView").addEventListener("click", function(){

    planets.forEach(function(p, i){

  // ---- §I4: el botón crear (hotkey) abre un popup con 3 opciones ----

  // ---- §I4/§I6/§J1–J3: creación de supermetas y metas ----
  var PALETTE = ["#3A6B54","#4E6E8E","#A85C6B","#6B8F71","#B9812E","#2E7B84","#8C5A7A","#C0672B","#4A6FA5","#9C4A3A"];
  var CAL_DEFAULT = [ { id: "cap-uni", name: "Cap. Universitario", color: "#2E7B84" },
                      { id: "personal", name: "Personal", color: "#6B8F71" } ];
  // v3 §K1/§K2: los calendarios se gestionan aparte; misma clave que calendario.html y
  // configuracion.html ("productvt-capas-v1", allí llamados "calendarios").
  function loadCals(){

  var cals = loadCals();
  var createMode = null, cSuperColor = cals[0].color, cGoalColor = PALETTE[0], cAnti = false;
  function wirePalette(el, get, set){
    el.innerHTML = "";
    var inp = document.getElementById(el.id.replace("Palette", "Custom")); // v3.3: picker RGB personalizado
    function markActive(active){
      Array.prototype.slice.call(el.children).forEach(function(x){ x.setAttribute("aria-pressed", String(x === active)); });
    }
    PALETTE.forEach(function(col){
      var b = document.createElement("button");
      b.type = "button"; b.style.background = col;
      b.setAttribute("aria-pressed", String(col === get()));
      b.addEventListener("click", function(){
        set(col);

        markActive(b);
      });
      el.appendChild(b);
    });
    if(inp){
      inp.value = get();
      inp.addEventListener("input", function(){
        set(inp.value);   // color personalizado RGB (v3.3)

      });
    }
  }
  function fillCals(){

function openCreate(mode){

  // §I6: plazo máximo 1 año, mínimo 1 segundo
  function toLocalInput(ms){
    var d = new Date(ms);
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function clampTime(v, min, max){
    var t = v ? new Date(v).getTime() : (min + 30 * 24 * 3600 * 1000);
    if(isNaN(t)) t = min + 30 * 24 * 3600 * 1000;
    if(t < min + 1000) t = min + 1000;   // mínimo 1 segundo
    if(t > min + max) t = min + max;     // máximo 1 año
    return t;
  }
  document.getElementById("createCancel").addEventListener("click", function(){ closeSheet(createSheet); });
  document.getElementById("createSave").addEventListener("click", function(){
    var ONE_YEAR = 365 * 24 * 3600 * 1000, now = Date.now();
    var name = document.getElementById("cGoalName").value.trim();
    var superSel = document.getElementById("cGoalSuper");
    var superTarget = planets.filter(function(p){ return p.id === superSel.value; })[0];
    if(!name){ document.getElementById("cGoalName").focus(); return; }
    if(createMode === "super"){
      var sName = document.getElementById("cSuperName").value.trim();
      if(!sName){ document.getElementById("cSuperName").focus(); return; }
      var sup = {
        id: "sg" + now, name: sName, color: cSuperColor, anti: cAnti,
        order: planets.length, deadline: clampTime(document.getElementById("cSuperDeadline").value, now, ONE_YEAR),
        calendarId: document.getElementById("cSuperCal").value || null, metas: []
      };
      planets.push(sup);
      superTarget = sup; // §J3: la primera meta pertenece a esta supermeta
      angles[sup.id] = -90 + (360 / Math.max(1, visiblePlanets().length)) * (visiblePlanets().length - 1);
    }
    if(!superTarget){ fillSupers(); return; }
    superTarget.metas.push({
      id: "g" + now + "-" + superTarget.metas.length,
      name: name, color: cGoalColor,
      deadline: clampTime(document.getElementById("cGoalDeadline").value, now, ONE_YEAR),
      tareas: document.getElementById("cGoalTasks").value.split("\n")
        .map(function(s){ return s.trim(); }).filter(Boolean)
        .map(function(n){ return { name: n, done: false }; })
    });

    saveJSON(POS_KEY, angles);

    render();
    hint.textContent = "“" + name + "” quedó dentro de “" + superTarget.name + "” — los bloques del cronómetro se registran ahí (§D1).";
    setTimeout(function(){ hint.textContent = hintOriginal; }, 3600);
  });
  function savePlanets(){
    try{
      localStorage.setItem("productvt-supermetas-v1", JSON.stringify(planets.map(function(p){
        return { id: p.id, name: p.name, color: p.color, anti: p.anti, deadline: p.deadline || null,
                 calendarId: p.calendarId || null,
                 goals: p.metas.map(function(m){
                   return { id: m.id, name: m.name, color: m.color, deadline: m.deadline || null,
                            tareas: (m.tareas || []).map(function(t){ return { name: t.name, done: !!t.done }; }) };
                 }) };
      })));
    }catch(e){}
  }

  // ---- §I5/§I2: bucle de animación (órbita leve y reordenamientos fluidos) ----
  var lastSave = 0;
  function frame(ts){
    tick();
    if(ts - lastSave > 4000){ lastSave = ts; saveJSON(ORBIT_KEY, orbits); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener("resize", render);
  window.addEventListener("beforeunload", function(){ saveJSON(ORBIT_KEY, orbits); savePlanets(); });
  render();
})();
</script>
</body>
