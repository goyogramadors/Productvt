<title>Cuaderno de Progreso</title>
<style>
  :root{
    --paper: #EFEDE5; --paper-raised: #FAF9F3; --ink: #20241E; --muted: #6E7368;
    --accent: #3A6B54; --accent-ink: #F3F7F1; --accent-soft: #DCE6DC;
    --rule: #D5D1C1; --rule-strong: #B9B4A0;
    --gold: #B9812E; --danger: #9C4A3A; --focus: #3A6B54;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
      --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
      --rule: #2B3225; --rule-strong: #3C4433;
      --gold: #D9A85C; --danger: #D08871; --focus: #7BB596;
    }
  }
  :root[data-theme="dark"]{
    --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
    --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
    --rule: #2B3225; --rule-strong: #3C4433;
    --gold: #D9A85C; --danger: #D08871; --focus: #7BB596;
  }
  *{ box-sizing: border-box; }
  body{ background: var(--paper); color: var(--ink); font-family: "Archivo", ui-sans-serif, system-ui, sans-serif; line-height: 1.45; }

  .shell{ max-width: 460px; margin: 0 auto; padding: 20px 18px 48px; }

  h1{ font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub{ font-size: 12.5px; color: var(--muted); margin: 0 0 18px; }

  .tabs{ display: flex; gap: 8px; margin-bottom: 18px; }
  .tab{
    flex: 1; border: 1px solid var(--rule-strong); background: var(--paper-raised); color: var(--muted);
    border-radius: 10px; padding: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500;
  }
  .tab[aria-pressed="true"]{ border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .tiles{ display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 22px; }
  .tile{ border: 1px solid var(--rule); border-radius: 10px; padding: 12px 10px; text-align: center; }
  .tile .val{ font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tile .lbl{ font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  h2{ font-family: "Fraunces", Georgia, serif; font-size: 16px; font-weight: 500; margin: 28px 0 10px; }

  .sparkline{ display: flex; align-items: flex-end; gap: 4px; height: 64px; margin-bottom: 6px; }
  .spark-bar{ flex: 1; background: var(--accent-soft); border-radius: 3px 3px 0 0; position: relative; min-height: 3px; }
  .spark-bar.today{ background: var(--accent); }
  .spark-labels{ display: flex; gap: 4px; font-family: "IBM Plex Mono", monospace; font-size: 9px; color: var(--muted); }
  .spark-labels span{ flex: 1; text-align: center; }

  .bar-row{ display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row .swatch{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bar-row .label{ width: 92px; font-size: 12.5px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track{ flex: 1; height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
  .bar-fill{ height: 100%; border-radius: 4px; }
  .bar-row .amount{ width: 52px; text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); flex: none; }

  .goal-card{ border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .goal-top{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .goal-top .name{ display: flex; align-items: center; gap: 7px; }
  .goal-top .swatch{ width: 8px; height: 8px; border-radius: 50%; }
  .goal-top .amount{ font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  .goal-track{ height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .goal-fill{ height: 100%; border-radius: 3px; }
  .goal-fill.met{ background: var(--accent); }
  .goal-fill.partial{ background: var(--gold); }

  .star-card{
    display: flex; align-items: center; gap: 14px; border: 1px solid var(--rule); border-radius: 12px;
    padding: 16px; margin-bottom: 8px;
  }
  .star-badge{ font-size: 30px; line-height: 1; opacity: .3; }
  .star-badge.earned{ opacity: 1; }
  .star-card .text strong{ display: block; font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 500; }
  .star-card .text span{ font-size: 12px; color: var(--muted); }

  .empty{ font-size: 13px; color: var(--muted); text-align: center; padding: 14px 0; }
  .note{ font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 24px; border-top: 1px dashed var(--rule-strong); padding-top: 12px; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..520;1,9..144,380..520&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<div class="shell">
  <h1>Cuaderno de progreso</h1>
  <p class="sub" id="rangeLabel"></p>

  <div class="tabs">
    <button class="tab" data-tab="estudio" aria-pressed="true">Estudio</button>
    <button class="tab" data-tab="ocio" aria-pressed="false">Ocio</button>
  </div>

  <div id="content"></div>

  <p class="note">Datos de ejemplo generados sobre el mes actual, misma fuente que el Almanaque. Racha = días consecutivos con al menos una sesión completada. Estrella mensual: todas las semanas cerradas con al menos una meta configurada, cumplidas — un mes sin metas nunca la obtiene.</p>
</div>

<script>
(function(){
  var CATS_KEY = "productvt-categorias-v1";
  var DEFAULT_CATEGORIES = [
    { id: "mate", name: "Matemáticas", color: "#B06A3A", type: "productiva" },
    { id: "lectura", name: "Lectura", color: "#4E6E8E", type: "productiva" },
    { id: "codigo", name: "Código", color: "#7A6A9E", type: "productiva" },
    { id: "idiomas", name: "Idiomas", color: "#A85C6B", type: "productiva" },
    { id: "pantalla", name: "Pausa de pantalla", color: "#6B8F71", type: "ocio" },
    { id: "ejercicio", name: "Ejercicio", color: "#C97A2B", type: "ocio" },
    { id: "social", name: "Social", color: "#8A6FA3", type: "ocio" }
  ];
  function loadCategories(){
    try{ var raw = localStorage.getItem(CATS_KEY); return raw ? JSON.parse(raw) : DEFAULT_CATEGORIES.slice(); }
    catch(e){ return DEFAULT_CATEGORIES.slice(); }
  }
  var CATEGORIES = loadCategories();
  function catsOf(type){ return CATEGORIES.filter(function(c){ return c.type === type; }); }
  function catById(id){ return CATEGORIES.find(function(c){ return c.id === id; }); }

  var GOALS_KEY = "productvt-metas-semanales-v1";
  function loadGoals(){
    try{
      var raw = localStorage.getItem(GOALS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var prod = catsOf("productiva");
    var seed = {};
    if(prod[0]) seed[prod[0].id] = 300;
    if(prod[2]) seed[prod[2].id] = 200;
    try{ localStorage.setItem(GOALS_KEY, JSON.stringify(seed)); }catch(e){}
    return seed;
  }
  var WEEKLY_GOALS = loadGoals(); // { categoryId: targetMinutes }

  function pad(n){ return String(n).padStart(2,"0"); }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function startOfWeek(d){ var day=(d.getDay()+6)%7; return addDays(d,-day); } // lunes

  var today = new Date();

  // ---- Sesiones de ejemplo, mismo generador determinístico que calendario.html ----
  var STATUSES = ["completed","completed","completed","cancelled","expired"];
  var demoSessions = [];
  (function seedDemo(){
    for(var d = 1; d <= today.getDate(); d++){
      var date = new Date(today.getFullYear(), today.getMonth(), d);
      var seed = (d * 7 + today.getMonth()) % 10;
      if(seed < 6){
        var cat = CATEGORIES[(d + seed) % CATEGORIES.length];
        var status = STATUSES[(d + seed) % STATUSES.length];
        var minutes = status === "completed" ? [25,50,75,100][d % 4] : [10,15,20][d % 3];
        demoSessions.push({ date: iso(date), categoryId: cat.id, status: status, minutes: minutes });
      }
      if(seed === 7){
        var cat2 = CATEGORIES[(d+2) % CATEGORIES.length];
        demoSessions.push({ date: iso(date), categoryId: cat2.id, status: "completed", minutes: 25 });
      }
    }
  })();

  function sessionsOfType(type){
    var ids = catsOf(type).map(function(c){ return c.id; });
    return demoSessions.filter(function(s){ return ids.indexOf(s.categoryId) !== -1 && s.status === "completed"; });
  }
  function minutesInRange(list, fromIso, toIso){
    return list.filter(function(s){ return s.date >= fromIso && s.date <= toIso; })
      .reduce(function(sum,s){ return sum + s.minutes; }, 0);
  }
  function computeStreak(list){
    var days = {};
    list.forEach(function(s){ days[s.date] = true; });
    var streak = 0, cursor = new Date(today);
    if(!days[iso(cursor)]) cursor = addDays(cursor, -1); // permite que hoy aún no tenga sesión
    while(days[iso(cursor)]){ streak++; cursor = addDays(cursor, -1); }
    return streak;
  }

  var content = document.getElementById("content");
  var rangeLabel = document.getElementById("rangeLabel");
  var currentTab = "estudio";

  function render(){
    var type = currentTab === "estudio" ? "productiva" : "ocio";
    var list = sessionsOfType(type);
    var weekStart = startOfWeek(today), weekEnd = addDays(weekStart, 6);
    var monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    var weekMinutes = minutesInRange(list, iso(weekStart), iso(weekEnd));
    var monthMinutes = minutesInRange(list, iso(monthStart), iso(today));
    var sessionCount = list.filter(function(s){ return s.date >= iso(monthStart); }).length;
    var streak = computeStreak(list);

    rangeLabel.textContent = "Semana del " + weekStart.getDate() + " al " + weekEnd.getDate() + " de " +
      today.toLocaleDateString("es", { month: "long" });

    var html = "";

    html += '<div class="tiles">' +
      '<div class="tile"><div class="val">'+weekMinutes+'</div><div class="lbl">min esta semana</div></div>' +
      '<div class="tile"><div class="val">'+streak+'</div><div class="lbl">racha (días)</div></div>' +
      '<div class="tile"><div class="val">'+sessionCount+'</div><div class="lbl">sesiones este mes</div></div>' +
      '</div>';

    // sparkline 14 días
    html += '<h2>Últimos 14 días</h2>';
    var days14 = [];
    for(var i = 13; i >= 0; i--) days14.push(addDays(today, -i));
    var perDay = days14.map(function(d){ return minutesInRange(list, iso(d), iso(d)); });
    var max = Math.max.apply(null, perDay.concat([1]));
    html += '<div class="sparkline">' + perDay.map(function(m,i){
      var h = Math.max(3, Math.round((m/max)*64));
      var isToday = i === perDay.length-1;
      return '<div class="spark-bar'+(isToday?" today":"")+'" style="height:'+h+'px" title="'+m+' min"></div>';
    }).join("") + '</div>';
    html += '<div class="spark-labels">' + days14.map(function(d){ return '<span>'+d.getDate()+'</span>'; }).join("") + '</div>';

    // desglose por categoría (mes)
    html += '<h2>Por categoría (este mes)</h2>';
    var cats = catsOf(type);
    var totals = cats.map(function(c){
      return { cat: c, minutes: minutesInRange(list.filter(function(s){ return s.categoryId===c.id; }), iso(monthStart), iso(today)) };
    }).filter(function(t){ return t.minutes > 0; }).sort(function(a,b){ return b.minutes-a.minutes; });
    if(totals.length){
      var maxCat = totals[0].minutes;
      html += totals.map(function(t){
        return '<div class="bar-row"><span class="swatch" style="background:'+t.cat.color+'"></span>' +
          '<span class="label">'+t.cat.name+'</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:'+Math.round(t.minutes/maxCat*100)+'%;background:'+t.cat.color+'"></span></span>' +
          '<span class="amount">'+t.minutes+' min</span></div>';
      }).join("");
    } else {
      html += '<p class="empty">Todavía no hay sesiones completadas este mes.</p>';
    }

    if(currentTab === "estudio"){
      // metas semanales
      html += '<h2>Metas semanales</h2>';
      var prodCats = catsOf("productiva").filter(function(c){ return WEEKLY_GOALS[c.id]; });
      if(prodCats.length){
        html += prodCats.map(function(c){
          var target = WEEKLY_GOALS[c.id];
          var got = minutesInRange(list.filter(function(s){ return s.categoryId===c.id; }), iso(weekStart), iso(weekEnd));
          var pct = Math.min(100, Math.round(got/target*100));
          var met = got >= target;
          return '<div class="goal-card"><div class="goal-top"><span class="name"><span class="swatch" style="background:'+c.color+'"></span>'+c.name+'</span>' +
            '<span class="amount">'+got+' / '+target+' min</span></div>' +
            '<div class="goal-track"><span class="goal-fill '+(met?"met":"partial")+'" style="width:'+pct+'%"></span></div></div>';
        }).join("");
      } else {
        html += '<p class="empty">No hay metas configuradas todavía.</p>';
      }

      // estrella mensual
      var weeksThisMonth = [];
      var w = startOfWeek(monthStart);
      while(w <= today){
        var wEnd = addDays(w,6);
        if(wEnd < today) weeksThisMonth.push({ start: w, end: wEnd });
        w = addDays(w,7);
      }
      var hasGoals = prodCats.length > 0;
      var allMet = hasGoals && weeksThisMonth.length > 0 && weeksThisMonth.every(function(wk){
        return prodCats.every(function(c){
          var got = minutesInRange(list.filter(function(s){ return s.categoryId===c.id; }), iso(wk.start), iso(wk.end));
          return got >= WEEKLY_GOALS[c.id];
        });
      });
      var earned = hasGoals && weeksThisMonth.length > 0 && allMet;
      html += '<h2>Estrella del mes</h2>';
      html += '<div class="star-card"><span class="star-badge'+(earned?" earned":"")+'">★</span><div class="text">' +
        '<strong>'+(earned ? "¡Conseguida!" : "Todavía no")+'</strong>' +
        '<span>'+(hasGoals ? weeksThisMonth.length+" semana(s) cerrada(s) evaluada(s)" : "Configurá al menos una meta para poder ganarla")+'</span>' +
        '</div></div>';
    }

    content.innerHTML = html;
  }

  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-pressed", b===btn); });
      render();
    });
  });

  render();
})();
</script>
