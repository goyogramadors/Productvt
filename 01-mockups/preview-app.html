<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productvt · Preview</title>
<!--
  Preview interactiva de la app (mockup de alta fidelidad funcional).
  - Tab bar real del producto (src/app/(tabs)/_layout.tsx): Cronómetro, Calendario,
    Estadísticas, Configuración + la Galaxia de inicio (01-mockups/mobile/inicio.html).
  - Cada tab embebe su mockup interactivo ya existente (skin "Papel"):
    cronometro.html tiene la máquina de estados completa del cronómetro
    (docs/03-CRONOMETRO.md): bloques, banco de descanso, ventanas de respuesta,
    almuerzo, cronómetro inverso, cancelación en dos pasos y panel de conflicto.
    Incluye controles de simulación (velocidad, saltar timer) arriba a la derecha.
  - Inicio = galaxia-v2.html (enmienda v3 §E: planetas/mini-planetas tipo Obsidian
    Graph View, arrastre con acomodo circular, vista de foco, antimetas ocultas).
    inicio.html queda como histórico.
  - Configuración incluye la jerarquía editable de supermetas/metas (v3 §F1).
  - Este archivo es solo un contenedor de preview: el código real vive en productvt-beta/.
-->
<style>
  :root{
    --paper: #EFEDE5;
    --paper-raised: #FAF9F3;
    --ink: #20241E;
    --muted: #6E7368;
    --accent: #3A6B54;
    --accent-ink: #F3F7F1;
    --accent-soft: #DCE6DC;
    --rule: #D5D1C1;
    --rule-strong: #B9B4A0;
    --hud-bg: #16213F; --hud-bg-2: #223462; --hud-ink: #F3F1E7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
      --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
      --rule: #2B3225; --rule-strong: #3C4433;
    }
  }
  :root[data-theme="dark"]{
    --paper: #14170F; --paper-raised: #1B1F16; --ink: #E9E7DC; --muted: #949A88;
    --accent: #7BB596; --accent-ink: #10241A; --accent-soft: #223429;
    --rule: #2B3225; --rule-strong: #3C4433;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  .app{ height: 100vh; display: flex; flex-direction: column; }

  .tabbar{
    display: flex;
    border-top: 1px solid var(--rule);
    background: var(--paper-raised);
    flex: none;
  }
  .tab{
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    padding: 9px 2px 10px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: inherit;
    border-right: 1px solid var(--rule);
  }
  .tab:last-child{ border-right: none; }
  .tab .ic{ font-size: 17px; line-height: 1; }
  .tab[aria-selected="true"]{ color: var(--accent); background: var(--accent-soft); }

  .views{ flex: 1; position: relative; min-height: 0; }
  .view{ position: absolute; inset: 0; display: none; }
  .view.show{ display: block; }
  .view iframe{ width: 100%; height: 100%; border: none; background: var(--paper); }
</style>
</head>
<body>
<div class="app">
  <div class="views" id="views">
    <div class="view show" data-tab="cronometro">
      <iframe src="mobile/cronometro.html" title="Cronómetro"></iframe>
    </div>
    <div class="view" data-tab="galaxia">
      <iframe src="mobile/galaxia-v2.html" title="Constelación de metas (v2)"></iframe>
    </div>
    <div class="view" data-tab="calendario">
      <iframe src="mobile/calendario.html" title="Calendario"></iframe>
    </div>
    <div class="view" data-tab="stats">
      <iframe src="mobile/estadisticas.html" title="Estadísticas"></iframe>
    </div>
    <div class="view" data-tab="settings">
      <iframe src="mobile/configuracion.html" title="Configuración"></iframe>
    </div>
  </div>
  <div class="tabbar" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-tab="cronometro"><span class="ic">⏱</span>Cronómetro</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="galaxia"><span class="ic">✦</span>Inicio</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="calendario"><span class="ic">▤</span>Calendario</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="stats"><span class="ic">◫</span>Estadísticas</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="settings"><span class="ic">⚙</span>Configuración</button>
  </div>
</div>
<script>
  var tabs = document.querySelectorAll(".tab");
  var views = document.querySelectorAll(".view");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      var id = tab.dataset.tab;
      tabs.forEach(function (t) { t.setAttribute("aria-selected", t === tab ? "true" : "false"); });
      views.forEach(function (v) { v.classList.toggle("show", v.dataset.tab === id); });
    });
  });
</script>
</body>
</html>
